# Prepare a Silica workspace on a hosted runner exactly as bootstrap.sh does
# locally: the workshop root, every repository from os/manifest.toml beside it
# (tools/sync.sh), the repository under test replaced by this checkout, the
# pinned toolchain, QEMU and OVMF.
name: silica-setup
description: Workspace, toolchain, emulator and compiler cache for tools/*.sh
inputs:
  repo:
    description: Name of the repository under test (spec, idl, kernel, os, ...)
    required: true
  deep:
    description: Install the host verifier for the deep tier
    default: 'false'
outputs:
  ws:
    description: Absolute path of the workspace root
    value: ${{ steps.ws.outputs.ws }}
  cache-key:
    description: The key to save the build cache (target/cache) under at the job's end
    value: ${{ steps.cache.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - id: ws
      shell: bash
      run: echo "ws=$RUNNER_TEMP/workshop" >>"$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        repository: project-silica/workshop
        path: _workshop
    # The emulator and its firmware, from packages kept between runs: on
    # 2026-11-23 this step took 3 min 45 s of a run's 5 (36 s in the run
    # before), and the check was cancelled.
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/apt-archives
        key: apt-${{ runner.os }}-qemu-v1
    - shell: bash
      run: |
        set -euo pipefail
        mv _workshop "${{ steps.ws.outputs.ws }}"
        t0=$SECONDS
        a="$RUNNER_TEMP/apt-archives"
        mkdir -p "$a/partial"
        net=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
        # The index every time (skipping it, 2026-11-23, made a stale one
        # fetch from mirrors for 205 s), the packages from the cache where
        # they are kept: each phase says how long it took.
        sudo apt-get update -qq "${net[@]}"
        echo "setup: package index in $((SECONDS - t0)) s"
        t1=$SECONDS
        sudo apt-get install -y -qq "${net[@]}" -o "Dir::Cache::Archives=$a" acl jq qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64 mtools socat >/dev/null
        sudo chown -R "$(id -un)" "$a"
        echo "setup: packages in $((SECONDS - t1)) s ($(ls "$a"/*.deb 2>/dev/null | wc -l) kept)"
        if [ -c /dev/kvm ] && [ ! -w /dev/kvm ]; then
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
        fi
    # The workflows' checker (tests/workflows_parse.sh), a release pinned by
    # its checksum.
    - shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        set -euo pipefail
        v=1.7.12 sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        curl -fsSL --retry 3 -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
        echo "$sum  actionlint.tar.gz" | sha256sum -c --quiet
        mkdir -p "$HOME/.local/bin" && tar -xzf actionlint.tar.gz -C "$HOME/.local/bin" actionlint
        echo "$HOME/.local/bin" >>"$GITHUB_PATH"
    - if: inputs.repo == 'kernel' || inputs.deep == 'true' || github.event_name == 'schedule'
      shell: bash
      # The project checkout uses its offline vendor directory. The host
      # verifier is installed from the registry before building the project.
      working-directory: ${{ runner.temp }}
      run: |
        cargo +stable install --locked --version 0.68.0 kani-verifier
        cargo kani setup
    - shell: bash
      working-directory: ${{ steps.ws.outputs.ws }}
      run: |
        set -euo pipefail
        repo='${{ inputs.repo }}'
        # A change that spans repositories is pushed as one branch name in
        # each; its checks take the other repositories from that branch
        # where it exists, and from os's pins elsewhere (sync.sh leaves a
        # clone already there on its branch). Without this, a protocol
        # change and its first user could only pass once the other had
        # merged.
        branch='${{ github.head_ref || github.ref_name }}'
        same() { [ -n "$branch" ] && [ "$branch" != main ] && git ls-remote --exit-code --heads "https://github.com/project-silica/$1" "$branch" >/dev/null 2>&1; }
        take() {
          if same "$1"; then
            git clone --quiet --branch "$branch" "https://github.com/project-silica/$1" "$1"
            echo "setup: $1 from its branch $branch"
          elif [ "$1" = os ]; then
            git clone --quiet https://github.com/project-silica/os os
          fi
        }
        if [ "$repo" = os ]; then
          cp -a "$GITHUB_WORKSPACE" os
        else
          take os
          cp -a "$GITHUB_WORKSPACE" "$repo"
        fi
        for d in idl kernel system; do
          [ "$d" = "$repo" ] || take "$d"
        done
        ./os/tools/sync.sh
        tc=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' kernel/rust-toolchain.toml)
        rustup toolchain install "$tc" --profile minimal --component rust-src,clippy,rustfmt,miri,llvm-tools
        ./tools/init.sh
    # The build cache is restored here and saved by the calling workflow's
    # last step whatever happened (`cache-key`), under a key of its run: a
    # key of the lock files alone was saved once and never again, and a run
    # that failed or ran out of time saved nothing, so every run rebuilt
    # what had changed since (on 2026-11-26 every pre-merge job ran out of
    # its 5 minutes building).
    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.ws.outputs.ws }}/target/cache
        key: silica-${{ inputs.repo }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          silica-${{ inputs.repo }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/rust-toolchain.toml') }}-
          silica-${{ inputs.repo }}-${{ runner.os }}-
    # Cargo judges a build fresh by its sources' times, and a checkout's
    # files are all as new as the checkout, so a restored cache rebuilt
    # every crate (and core, from a toolchain installed anew). The cache
    # keeps each tracked file's content hash and time as the build that
    # saved it saw them: a file with the same content gets that time back,
    # a changed one keeps the checkout's and is rebuilt. The toolchain's
    # library sources are as old as the toolchain (its version is part of
    # every fingerprint).
    - shell: bash
      working-directory: ${{ steps.ws.outputs.ws }}
      run: |
        set -euo pipefail
        m=target/cache/source-times.tsv cur=$RUNNER_TEMP/source-blobs.tsv
        mkdir -p target/cache
        for r in . idl kernel system os; do
          [ -e "$r/.git" ] || continue
          git -C "$r" ls-files -s | awk -v r="$r" '{ split($0, f, "\t"); split(f[1], a, " "); print r "/" f[2] "\t" a[2] }'
        done >"$cur"
        same=0
        if [ -f "$m" ]; then
          awk -F'\t' 'NR == FNR { t[$1 "\t" $2] = $3; next } ($1 "\t" $2) in t { print t[$1 "\t" $2] "\t" $1 }' "$m" "$cur" >"$RUNNER_TEMP/same.tsv"
          perl -MTime::HiRes=utime -F'\t' -lane 'utime($F[0], $F[0], $F[1]) if -f $F[1] && ! -l $F[1]' "$RUNNER_TEMP/same.tsv"
          same=$(wc -l <"$RUNNER_TEMP/same.tsv")
        fi
        cut -f1 "$cur" | tr '\n' '\0' | xargs -0 stat -c '%.9Y' >"$RUNNER_TEMP/times"
        paste "$cur" "$RUNNER_TEMP/times" >"$m"
        src=$(cd kernel && rustc --print sysroot)/lib/rustlib/src
        find "$src" -type f -exec touch -d @946684800 {} +
        echo "setup: $same of $(wc -l <"$cur") source files have the times the cache was built with"
