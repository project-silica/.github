# Pre-merge check: 5 minutes a job, blocks merge. The fast tier runs as two
# jobs at once (tools/test.sh with SILICA_SHARD: the guests dealt between
# them, the rest in the first); `pre-merge` is green when both are, and is
# the check branch protection requires.
# Format, lint, build, host tests, size and bloat gates, dependency direction,
# boot smoke test, all through the same tools/ scripts used locally.
# A documentation-only change runs the format check and nothing else.
name: pre-merge
on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
permissions:
  contents: read
jobs:
  fast:
    name: fast tier ${{ matrix.shard }}/2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # 26.04: its QEMU (10.2) emulates x2APIC and the TSC-deadline timer,
    # which Silica requires; 24.04's QEMU 8.2 does neither under TCG.
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before || '' }}
          docs=false
          if [ -n "$base" ] && git cat-file -e "$base" 2>/dev/null; then
            changed=$(git diff --name-only "$base" HEAD)
            [ -n "$changed" ] && ! grep -qvE '\.md$|^LICENSE' <<<"$changed" && docs=true
          fi
          echo "docs=$docs" >>"$GITHUB_OUTPUT"
      - id: setup
        uses: project-silica/.github/actions/setup@main
        with:
          repo: ${{ inputs.repo }}
      - name: fast tier
        if: steps.paths.outputs.docs != 'true'
        working-directory: ${{ steps.setup.outputs.ws }}
        run: |
          set -o pipefail
          # Its own limit inside the job's 5 minutes (setup takes about 60 s,
          # saving the cache 15 s), so that a run out of time still saves the
          # cache it built. timeout-minutes counts whole minutes only.
          SILICA_SHARD='${{ matrix.shard }}/2' timeout --kill-after=5 215 ./tools/test.sh --fast --repo '${{ inputs.repo }}' 2>&1 | tee "$RUNNER_TEMP/test.out" || { rc=$?; [ "$rc" != 124 ] || echo "::error::the fast tier ran out of its 215 s"; grep "^ERROR" "$RUNNER_TEMP/test.out" | head -30 | sed "s/^/::error::/"; exit 1; }
      - name: dependency direction
        if: steps.paths.outputs.docs != 'true' && matrix.shard == 1
        working-directory: ${{ steps.setup.outputs.ws }}
        run: ./tools/check-deps.sh
      - name: format only
        if: steps.paths.outputs.docs == 'true' && matrix.shard == 1
        working-directory: ${{ steps.setup.outputs.ws }}/${{ inputs.repo }}
        run: if [ -f Cargo.toml ]; then cargo fmt --all --check; fi
      - uses: actions/cache/save@v4
        if: always() && steps.setup.outputs.cache-key != ''
        with:
          path: ${{ steps.setup.outputs.ws }}/target/cache
          key: ${{ steps.setup.outputs.cache-key }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-pre-merge-${{ inputs.repo }}-${{ matrix.shard }}
          path: |
            ${{ steps.setup.outputs.ws }}/target/logs
            ${{ steps.setup.outputs.ws }}/target/runs/test.*/units.tsv
  pre-merge:
    needs: fast
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: both jobs of the fast tier passed
        run: test '${{ needs.fast.result }}' = success
