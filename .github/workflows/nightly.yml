# Nightly run, on os: tools/test.sh --deep (the full suites plus fuzzing).
# Never blocks a push; the logs are uploaded as an artifact.
name: nightly
on:
  workflow_call:
permissions:
  contents: read
jobs:
  deep:
    # 26.04: its QEMU (10.2) emulates x2APIC and the TSC-deadline timer,
    # which Silica requires; 24.04's QEMU 8.2 does neither under TCG.
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: project-silica/.github/actions/setup@main
        with:
          repo: os
      - name: Install cargo-fuzz for the deep tier
        working-directory: ${{ runner.temp }}
        run: cargo +stable install --locked --version 0.13.2 cargo-fuzz
      - working-directory: ${{ steps.setup.outputs.ws }}
        run: |
          set -o pipefail
          ./tools/test.sh --deep 2>&1 | tee "$RUNNER_TEMP/test.out" || { grep "^ERROR" "$RUNNER_TEMP/test.out" | head -30 | sed "s/^/::error::/"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-nightly
          path: |
            ${{ steps.setup.outputs.ws }}/target/logs
            ${{ steps.setup.outputs.ws }}/target/fuzz/*/*/build.log
            ${{ steps.setup.outputs.ws }}/target/fuzz/*/*/run.log
            ${{ steps.setup.outputs.ws }}/target/runs/bench.*/*.serial
