# Nightly run, on os: tools/test.sh --deep (the full suites plus fuzzing).
# Never blocks a push; the logs are uploaded as an artifact.
name: nightly
on:
  workflow_call:
permissions:
  contents: read
jobs:
  deep:
    # 26.04: its QEMU (10.2) emulates x2APIC and the TSC-deadline timer,
    # which Silica requires; 24.04's QEMU 8.2 does neither under TCG.
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: project-silica/.github/actions/setup@main
        with:
          repo: os
          deep: 'true'
      - name: Install cargo-fuzz for the deep tier
        working-directory: ${{ runner.temp }}
        run: cargo +stable install --locked --version 0.13.2 cargo-fuzz
      - name: Install the instruction counter's QEMU build headers
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get install -y -qq libglib2.0-dev pkg-config
          if [ ! -f /usr/include/qemu-plugin.h ]; then
            qemu-system-x86_64 --version | grep -E '^QEMU emulator version 10\.2\.'
            curl --fail --location --retry 3 -o qemu-plugin.h https://raw.githubusercontent.com/qemu/qemu/v10.2.1/include/qemu/qemu-plugin.h
            echo "aebc639d01685893a9d71b9ef3afa7ea67e0be6a8959781c4057bd4974d05d4d  qemu-plugin.h" | sha256sum --check
            sudo install -m 0644 qemu-plugin.h /usr/include/qemu-plugin.h
          fi
      - name: Select ARM firmware for the emulated max CPU
        working-directory: ${{ runner.temp }}
        run: |
          # Resolute's 2025.11 AAVMF faults when it enables translation,
          # before it can start the loader (nightly 45176778475).
          pkg=qemu-efi-aarch64_2026.05-2ubuntu3_all.deb
          curl --fail --location --retry 3 -o "$pkg" "https://archive.ubuntu.com/ubuntu/pool/main/e/edk2/$pkg"
          echo "698c5b3ace315a6df97f8e3300e98f2f8692395f0051c373c2b863c8c83fb701  $pkg" | sha256sum --check
          dpkg-deb --extract "$pkg" arm-firmware
          ln -s /usr/share/OVMF arm-firmware/usr/share/OVMF
          echo "SILICA_FW_ROOT=$PWD/arm-firmware" >> "$GITHUB_ENV"
      - working-directory: ${{ steps.setup.outputs.ws }}
        run: |
          set -o pipefail
          ./tools/test.sh --deep 2>&1 | tee "$RUNNER_TEMP/test.out" || { grep "^ERROR" "$RUNNER_TEMP/test.out" | head -30 | sed "s/^/::error::/"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-nightly
          path: |
            ${{ steps.setup.outputs.ws }}/target/logs
            ${{ steps.setup.outputs.ws }}/target/fuzz/*/*/build.log
            ${{ steps.setup.outputs.ws }}/target/fuzz/*/*/run.log
            ${{ steps.setup.outputs.ws }}/target/runs/bench.*/*.serial
            ${{ steps.setup.outputs.ws }}/target/runs/test.*/units.tsv
            ${{ steps.setup.outputs.ws }}/target/runs/test.*/named/fast_budget/fastbudget.*/run.log
